<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Account</title>

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --charcoal: #000000;
      --ivory: #F9F9F6;
      --champagne: #F7E7CE;
      --rose-gold: #B76E79;
      --sage: #A8B5A2;
      --blush: #F2D6D0;
    }

    body {
      background: var(--ivory);
      color: var(--charcoal);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    header, footer {
      background: var(--champagne);
      padding: 1.5rem;
      text-align: center;
      border-bottom: 2px solid var(--rose-gold);
    }

    header h1, footer p {
      font-family: 'Playfair Display', serif;
      color: var(--rose-gold);
      margin: 0;
    }

    nav {
      text-align: center;
      background: #fff;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
      color: var(--charcoal);
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--rose-gold);
    }

    .profile-container {
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
      max-width: 1100px;
      margin: 2rem auto;
    }

    .card {
      background: linear-gradient(to bottom right, #fff, var(--ivory));
      border: 1px solid var(--champagne);
      border-radius: 16px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      padding: 2rem;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      color: var(--rose-gold);
      margin-bottom: 1rem;
    }

    .icon {
      font-size: 2rem;
      color: var(--rose-gold);
      position: absolute;
      top: 1rem;
      right: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      border: 1px solid #eee;
      padding: 0.75rem;
      text-align: left;
    }

    th {
      background: var(--ivory);
      font-family: 'Playfair Display', serif;
      color: var(--charcoal);
    }

    td {
      color: var(--charcoal);
    }

    .loading {
      color: #777;
    }

    .logout-btn {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: var(--rose-gold);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .logout-btn:hover {
      background: var(--sage);
    }

    .empty-orders {
      color: #777;
      font-style: italic;
      margin-top: 1rem;
    }
  </style>

</head>

<body>

<header>
  <h1>Noiré</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="routine.html">Routine Builder</a>

  <a href="cart.html">Cart</a>

     FIREBASE

<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  // ==============================
  // FIREBASE CONFIG
  // ==============================

  const firebaseConfig = {

    apiKey: "AIzaSyAxcZCFA9IPIfv-slryJXdPQJ_lfttKMC8",

    authDomain: "noire-17ed6.firebaseapp.com",

    databaseURL:
      "https://noire-17ed6-default-rtdb.firebaseio.com",

    projectId: "noire-17ed6",

    storageBucket:
      "noire-17ed6.appspot.com",

    messagingSenderId:
      "559789891078",

    appId:
      "1:559789891078:web:7bf4c52bce62c3b8b9ad87"

  };


  // ==============================
  // INITIALIZE FIREBASE
  // ==============================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  // ==============================
  // CHECK CURRENT USER
  // ==============================

  onAuthStateChanged(auth, async (user) => {

    if (user) {

      console.log("Currently logged in:", user.uid);


      try {

        // Get the user's database record

        const userRef =
          ref(db, "users/" + user.uid);

        const snapshot =
          await get(userRef);


        if (snapshot.exists()) {

          const userData =
            snapshot.val();


          // ==============================
          // DISPLAY USERNAME
          // ==============================

          document.getElementById("usernameValue")
            .textContent =
              userData.username || "No username";


          // ==============================
          // DISPLAY EMAIL
          // ==============================

          document.getElementById("emailValue")
            .textContent =
              userData.email || user.email || "No email";


          // ==============================
          // DISPLAY SKIN TYPE
          // ==============================

          document.getElementById("skinTypeValue")
            .textContent =
              userData.skinType || "Not set yet";


          // ==============================
          // DISPLAY SKIN CONDITION
          // ==============================

          document.getElementById("skinConditionValue")
            .textContent =
              userData.skinCondition || "Not set yet";


        } else {

          console.log(
            "No profile found in Realtime Database."
          );

          document.getElementById("usernameValue")
            .textContent =
              user.displayName || "User";

          document.getElementById("emailValue")
            .textContent =
              user.email || "No email";

        }


      } catch (error) {

        console.error(
          "Error loading account:",
          error
        );

        document.getElementById("usernameValue")
          .textContent =
            "Unable to load";

        document.getElementById("emailValue")
          .textContent =
            "Unable to load";

      }


    } else {

      // ==============================
      // NO USER LOGGED IN
      // ==============================

      console.log("No user logged in.");

      alert("Please log in first.");

      window.location.href =
        "signuplogin.html";

    }

  });


  // ==============================
  // LOGOUT
  // ==============================

  document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

      try {

        await signOut(auth);

        alert("You have been logged out. 💗");

        window.location.href =
          "signuplogin.html";

      } catch (error) {

        console.error(
          "Logout error:",
          error
        );

        alert(error.message);

      }

    });


  // ==============================
  // SKIN TYPE FROM LOCAL STORAGE
  // ==============================

</script>

</body>
</html>
