<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Account | Noiré</title>

  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --charcoal: #000000;
      --ivory: #F9F9F6;
      --champagne: #F7E7CE;
      --rose-gold: #B76E79;
      --sage: #A8B5A2;
      --blush: #F2D6D0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--ivory);
      color: var(--charcoal);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    /* ==============================
       HEADER
    ============================== */

    header {
      background: var(--champagne);
      padding: 2rem;
      text-align: center;
      border-bottom: 2px solid var(--rose-gold);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: var(--rose-gold);
      margin: 0;
    }

    /* ==============================
       NAVIGATION
    ============================== */

    nav {
      text-align: center;
      background: #fff;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
      color: var(--charcoal);
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--rose-gold);
    }

    /* ==============================
       ACCOUNT TITLE
    ============================== */

    .account-title {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }

    .account-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      color: var(--rose-gold);
      margin: 0 0 0.5rem;
    }

    .account-title p {
      color: #666;
      margin: 0;
      font-size: 1rem;
    }

    /* ==============================
       PROFILE CONTAINER
    ============================== */

    .profile-container {
      padding: 1.5rem 2rem 3rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(300px, 1fr));
      gap: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* ==============================
       CARDS
    ============================== */

    .card {
      background: linear-gradient(
        to bottom right,
        #ffffff,
        var(--ivory)
      );

      border: 1px solid var(--champagne);
      border-radius: 16px;

      box-shadow: 0 5px 14px rgba(0,0,0,0.08);

      padding: 2rem;
      position: relative;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.11);
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      color: var(--rose-gold);
      margin: 0 0 1.3rem;
      font-size: 1.6rem;
    }

    /* ==============================
       ICON
    ============================== */

    .icon {
      font-size: 1.8rem;
      position: absolute;
      top: 1.2rem;
      right: 1.3rem;
    }

    /* ==============================
       PROFILE DETAILS
    ============================== */

    .profile-detail {
      padding: 0.8rem 0;
      border-bottom: 1px solid #eee;
      font-size: 0.95rem;
    }

    .profile-detail:last-of-type {
      border-bottom: none;
    }

    .profile-detail strong {
      display: inline-block;
      min-width: 65px;
      color: #555;
    }

    .loading {
      color: #777;
    }

    /* ==============================
       SKIN INFORMATION
    ============================== */

    .skin-display {
      background: var(--blush);
      border-radius: 12px;
      padding: 1.3rem;
      text-align: center;
      margin-top: 0.5rem;
      border: 1px solid rgba(183,110,121,0.12);
    }

    .skin-display p {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--charcoal);
      font-weight: 600;
    }

    /* ==============================
       ORDER HISTORY
    ============================== */

    .empty-orders {
      color: #777;
      font-style: italic;
      margin-top: 1rem;

      background: rgba(247,231,206,0.35);

      padding: 1.5rem;

      border-radius: 12px;

      text-align: center;

      border: 1px dashed var(--champagne);
    }

    /* ==============================
       LOGOUT BUTTON
    ============================== */

    .logout-btn {
      margin-top: 18px;
      padding: 10px 20px;

      border: none;
      border-radius: 8px;

      background: var(--rose-gold);
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.3s ease,
        transform 0.2s ease;

      width: 100%;
    }

    .logout-btn:hover {
      background: var(--sage);
      transform: translateY(-2px);
    }

    /* ==============================
       FOOTER
    ============================== */

    footer {
      background: var(--champagne);
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      border-top: 2px solid var(--rose-gold);
    }

    footer p {
      margin: 0;
      font-family: 'Playfair Display', serif;
      color: var(--rose-gold);
    }

    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 750px) {

      .profile-container {
        grid-template-columns: 1fr;
        padding: 1rem 1.2rem 2rem;
      }

      nav {
        overflow-x: auto;
        white-space: nowrap;
      }

      nav a {
        margin: 0 8px;
      }
    }

    @media (max-width: 480px) {

      header h1 {
        font-size: 2.5rem;
      }

      .account-title h2 {
        font-size: 2rem;
      }

      .card {
        padding: 1.5rem;
      }
    }
  </style>

</head>

<body>

<header>
  <h1>Noiré</h1>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="routine.html">Routine Builder</a>
  <a href="account.html">Account</a>
  <a href="cart.html">Cart</a>
</nav>

<!-- ACCOUNT TITLE -->

<section class="account-title">
  <h2>Your Account</h2>
  <p>View your profile and personalized skincare information.</p>
</section>

<div class="profile-container">

  <!-- PROFILE INFORMATION -->

  <div class="card">

<span class="icon">👤</span>

<h2>Profile Information</h2>

<div class="profile-detail">
  <strong>Name:</strong>
  <span id="usernameValue" class="loading">
    Loading...
  </span>
</div>

<div class="profile-detail">
  <strong>Email:</strong>
  <span id="emailValue" class="loading">
    Loading...
  </span>
</div>

<button id="logoutBtn" class="logout-btn">
  Logout
</button>

  </div>

  <!-- SKIN TYPE -->

  <div class="card">

<span class="icon">✨</span>

<h2>Skin Type</h2>

<div class="skin-display">
  <p id="skinTypeValue">
    Loading...
  </p>
</div>

  </div>

  <!-- SKIN CONDITION -->

  <div class="card">

<span class="icon">🌸</span>

<h2>Skin Condition</h2>

<div class="skin-display">
  <p id="skinConditionValue">
    Not set yet
  </p>
</div>

  </div>

  <!-- ORDER HISTORY -->

  <div class="card">

<span class="icon">🛒</span>

<h2>Order History</h2>

<p class="empty-orders">
  No orders yet.
</p>

<!--
  ORDER HISTORY WILL BE ADDED HERE LATER
  ONCE THE PRODUCTS AND CART SYSTEM ARE DONE.
-->

  </div>

</div>

<footer>
  <p>&copy; 2026 Noiré Skincare</p>
</footer>

<!-- ==============================
     FIREBASE
============================== -->

<script type="module">

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  // ==============================
  // FIREBASE CONFIG
  // ==============================

  const firebaseConfig = {

    apiKey: "AIzaSyAxcZCFA9IPIfv-slryJXdPQJ_lfttKMC8",

    authDomain: "noire-17ed6.firebaseapp.com",

    databaseURL:
      "https://noire-17ed6-default-rtdb.firebaseio.com",

    projectId: "noire-17ed6",

    storageBucket:
      "noire-17ed6.appspot.com",

    messagingSenderId:
      "559789891078",

    appId:
      "1:559789891078:web:7bf4c52bce62c3b8b9ad87"

  };


  // ==============================
  // INITIALIZE FIREBASE
  // ==============================

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  // ==============================
  // CHECK CURRENT USER
  // ==============================

  onAuthStateChanged(auth, async (user) => {

    if (user) {

      console.log(
        "Currently logged in:",
        user.uid
      );


      try {

        const userRef =
          ref(db, "users/" + user.uid);

        const snapshot =
          await get(userRef);


        if (snapshot.exists()) {

          const userData =
            snapshot.val();


          // USERNAME

          document.getElementById("usernameValue")
            .textContent =
              userData.username || "No username";


          // EMAIL

          document.getElementById("emailValue")
            .textContent =
              userData.email ||
              user.email ||
              "No email";


          // SKIN TYPE

          document.getElementById("skinTypeValue")
            .textContent =
              userData.skinType ||
              "Not set yet";


          // SKIN CONDITION

          document.getElementById("skinConditionValue")
            .textContent =
              userData.skinCondition ||
              "Not set yet";


        } else {

          console.log(
            "No profile found in Realtime Database."
          );


          document.getElementById("usernameValue")
            .textContent =
              user.displayName ||
              "User";


          document.getElementById("emailValue")
            .textContent =
              user.email ||
              "No email";


          document.getElementById("skinTypeValue")
            .textContent =
              "Not set yet";


          document.getElementById("skinConditionValue")
            .textContent =
              "Not set yet";

        }


      } catch (error) {

        console.error(
          "Error loading account:",
          error
        );


        document.getElementById("usernameValue")
          .textContent =
            "Unable to load";


        document.getElementById("emailValue")
          .textContent =
            "Unable to load";


        document.getElementById("skinTypeValue")
          .textContent =
            "Unable to load";


        document.getElementById("skinConditionValue")
          .textContent =
            "Unable to load";

      }


    } else {

      console.log(
        "No user logged in."
      );


      alert(
        "Please log in first."
      );


      window.location.href =
        "signuplogin.html";

    }

  });


  // ==============================
  // LOGOUT
  // ==============================

  document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

      try {

        await signOut(auth);


        alert(
          "You have been logged out. 💗"
        );


        window.location.href =
          "signuplogin.html";


      } catch (error) {

        console.error(
          "Logout error:",
          error
        );


        alert(
          error.message
        );

      }

    });

</script>

</body>
</html>
