<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Routine Builder | Noiré</title>

  <!-- Bootstrap CSS -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    /* ==============================
       NOIRÉ COLORS
    ============================== */

    :root {
      --charcoal: #000000;
      --ivory: #F9F9F6;
      --champagne: #F7E7CE;
      --rose-gold: #B76E79;
      --sage: #A8B5A2;
      --blush: #F2D6D0;
    }


    /* ==============================
       GENERAL
    ============================== */

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--ivory);
      color: var(--charcoal);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }


    /* ==============================
       HEADER
    ============================== */

    header {
      background: var(--champagne);
      text-align: center;
      padding: 2rem;
      border-bottom: 2px solid var(--rose-gold);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: var(--rose-gold);
      margin: 0;
    }


    /* ==============================
       NAVIGATION
    ============================== */

    nav {
      text-align: center;
      background: #fff;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
      color: var(--charcoal);
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--rose-gold);
    }


    /* ==============================
       PAGE INTRO
    ============================== */

    .routine-intro {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }

    .routine-intro h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--rose-gold);
      margin-bottom: 0.5rem;
    }

    .routine-intro p {
      color: #666;
      margin: 0;
      font-size: 1rem;
    }


    /* ==============================
       MAIN QUIZ CARD
    ============================== */

    .quiz-card {
      background: linear-gradient(
        to bottom right,
        #ffffff,
        var(--ivory)
      );

      border: 1px solid var(--champagne);
      border-radius: 18px;

      box-shadow: 0 6px 18px rgba(0,0,0,0.08);

      padding: 2.5rem;

      max-width: 700px;

      margin: 1.5rem auto 3rem;

      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;
    }

    .quiz-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 9px 22px rgba(0,0,0,0.11);
    }


    /* ==============================
       QUIZ TITLE
    ============================== */

    .quiz-title {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .quiz-title h3 {
      font-family: 'Playfair Display', serif;
      color: var(--rose-gold);
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .quiz-title p {
      color: #666;
      font-size: 0.95rem;
      margin: 0;
    }


    /* ==============================
       PROGRESS
    ============================== */

    .progress-wrapper {
      margin-bottom: 2rem;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 0.85rem;
      color: #777;

      margin-bottom: 0.5rem;
    }

    .progress {
      height: 8px;
      background: #eee;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      background-color: var(--rose-gold);
      border-radius: 20px;
      transition: width 0.4s ease;
    }


    /* ==============================
       QUESTION
    ============================== */

    #question-container {
      background: rgba(247, 231, 206, 0.25);

      border: 1px solid rgba(247, 231, 206, 0.8);

      border-radius: 14px;

      padding: 1.8rem;

      min-height: 250px;
    }

    #question-container h5 {
      font-family: 'Playfair Display', serif;
      font-size: 1.35rem;

      color: var(--charcoal);

      margin-bottom: 1.5rem;

      line-height: 1.5;
    }


    /* ==============================
       ANSWER OPTIONS
    ============================== */

    .form-check {
      background: #fff;

      border: 1px solid #eee;

      border-radius: 10px;

      padding: 0.85rem 1rem 0.85rem 2.7rem;

      margin-bottom: 0.75rem;

      cursor: pointer;

      transition:
        border-color 0.25s ease,
        background 0.25s ease,
        transform 0.2s ease;
    }

    .form-check:hover {
      border-color: var(--rose-gold);
      background: var(--ivory);
      transform: translateX(3px);
    }

    .form-check-input {
      margin-top: 0.25rem;
      cursor: pointer;
    }

    .form-check-input:checked {
      background-color: var(--rose-gold);
      border-color: var(--rose-gold);
    }

    .form-check-input:focus {
      box-shadow: 0 0 0 0.2rem rgba(183,110,121,0.15);
    }

    .form-check-label {
      cursor: pointer;
      font-size: 0.95rem;
      width: 100%;
    }


    /* ==============================
       BUTTONS
    ============================== */

    .quiz-buttons {
      margin-top: 1.5rem;
    }

    .btn-primary {
      background-color: var(--rose-gold);
      border: none;

      color: var(--ivory);

      border-radius: 8px;

      padding: 0.65rem 1.7rem;

      font-weight: 600;

      transition:
        background 0.3s ease,
        transform 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--sage);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-primary:focus {
      background-color: var(--rose-gold);
      box-shadow: 0 0 0 0.2rem rgba(183,110,121,0.2);
    }

    .btn-secondary {
      background-color: var(--blush);
      border: none;

      color: var(--charcoal);

      border-radius: 8px;

      padding: 0.65rem 1.5rem;

      font-weight: 600;

      transition:
        background 0.3s ease,
        color 0.3s ease,
        transform 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: var(--sage);
      color: #fff;
      transform: translateY(-2px);
    }

    .btn-secondary:disabled {
      background-color: #eee;
      color: #aaa;
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }


    /* ==============================
       RESULT
    ============================== */

    .result {
      font-size: 1rem;

      margin-top: 2rem;

      text-align: center;

      color: var(--charcoal);

      background: var(--blush);

      border-radius: 14px;

      padding: 1.5rem;

      border: 1px solid rgba(183,110,121,0.12);

      line-height: 1.8;

      animation: fadeIn 0.5s ease;
    }

    .result strong {
      color: var(--rose-gold);
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
    }


    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }


    /* ==============================
       FOOTER
    ============================== */

    footer {
      background: var(--champagne);

      text-align: center;

      padding: 1rem;

      font-size: 0.9rem;

      border-top: 2px solid var(--rose-gold);
    }

    footer p {
      margin: 0;

      font-family: 'Playfair Display', serif;

      color: var(--rose-gold);
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media (max-width: 750px) {

      nav {
        overflow-x: auto;
        white-space: nowrap;
      }

      nav a {
        margin: 0 8px;
      }

      .quiz-card {
        margin: 1rem 1rem 2rem;
        padding: 1.5rem;
      }

      .routine-intro h2 {
        font-size: 2rem;
      }

    }


    @media (max-width: 480px) {

      header h1 {
        font-size: 2.5rem;
      }

      .quiz-title h3 {
        font-size: 1.5rem;
      }

      #question-container {
        padding: 1.2rem;
      }

      #question-container h5 {
        font-size: 1.15rem;
      }

      .quiz-buttons {
        gap: 0.75rem;
      }

      .btn-primary,
      .btn-secondary {
        padding: 0.6rem 1rem;
      }

    }

  </style>

</head>

<body>

<!-- ==============================
     HEADER
============================== -->

<header>
  <h1>Noiré</h1>
</header>

<!-- ==============================
     NAVIGATION
============================== -->

<nav>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="routine.html">Routine Builder</a>
  <a href="account.html">Account</a>
  <a href="cart.html">Cart</a>
</nav>

<!-- ==============================
     PAGE INTRO
============================== -->

<section class="routine-intro">

  <h2>Routine Builder</h2>

  <p>
    Discover a skincare routine tailored to your skin.
  </p>

</section>

<!-- ==============================
     QUIZ
============================== -->

<div class="container">

  <div class="quiz-card">

<div class="quiz-title">

  <h3>Find Your Routine 🧴</h3>

  <p>
    Answer 10 quick questions to discover
    products tailored to your skin.
  </p>

</div>


<!-- PROGRESS -->

<div class="progress-wrapper">

  <div class="progress-label">

    <span>Quiz Progress</span>

    <span id="progressText">
      0 / 10
    </span>

  </div>

  <div class="progress">

    <div
      id="progressBar"
      class="progress-bar"
      role="progressbar"
      style="width: 0%"
    ></div>

  </div>

</div>


<!-- FORM -->

<form id="skinQuiz">

  <div id="question-container"></div>


  <div
    class="quiz-buttons d-flex justify-content-between"
  >

    <button
      type="button"
      id="prevBtn"
      class="btn btn-secondary"
      disabled
    >
      ← Previous
    </button>


    <button
      type="button"
      id="nextBtn"
      class="btn btn-primary"
    >
      Next →
    </button>

  </div>

</form>


<!-- RESULT -->

<div
  id="result"
  class="result"
  style="display: none;"
></div>

  </div>

</div>

<!-- ==============================
     FOOTER
============================== -->

<footer>

  <p>
    &copy; 2026 Noiré Skincare. All rights reserved.
  </p>

</footer>

<!-- ==============================
     BOOTSTRAP JS
============================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">

  /* =========================================
     FIREBASE IMPORTS
  ========================================= */

  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getAuth,
    onAuthStateChanged
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get,
    update
  } from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


  /* =========================================
     FIREBASE CONFIG
  ========================================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAxcZCFA9IPIfv-slryJXdPQJ_lfttKMC8",

    authDomain:
      "noire-17ed6.firebaseapp.com",

    databaseURL:
      "https://noire-17ed6-default-rtdb.firebaseio.com",

    projectId:
      "noire-17ed6",

    storageBucket:
      "noire-17ed6.appspot.com",

    messagingSenderId:
      "559789891078",

    appId:
      "1:559789891078:web:7bf4c52bce62c3b8b9ad87"

  };


  /* =========================================
     INITIALIZE FIREBASE
  ========================================= */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getDatabase(app);


  /* =========================================
     QUIZ QUESTIONS
  ========================================= */

  const questions = [

    {
      q: "How does your skin feel after washing?",
      options: {
        "Feels tight/dry": "Dry",
        "Feels greasy": "Oily",
        "Red/irritated": "Sensitive",
        "Dry in some areas, oily in others": "Combination",
        "Feels fine": "Normal"
      }
    },

    {
      q: "How often do you get breakouts?",
      options: {
        "Rarely": "Normal",
        "Frequently": "Oily",
        "Sometimes": "Combination",
        "Triggered by products": "Sensitive",
        "When skin is dry": "Dry"
      }
    },

    {
      q: "How does your skin react to moisturizer?",
      options: {
        "Absorbs quickly": "Dry",
        "Feels greasy": "Oily",
        "Works in some areas": "Combination",
        "Stings or burns": "Sensitive",
        "Feels fine": "Normal"
      }
    },

    {
      q: "Do you experience redness or irritation?",
      options: {
        "Yes, often": "Sensitive",
        "Sometimes": "Combination",
        "Rarely": "Normal",
        "Only when dry": "Dry",
        "Only when oily": "Oily"
      }
    },

    {
      q: "How shiny does your skin get midday?",
      options: {
        "Not at all": "Dry",
        "Very shiny": "Oily",
        "T-zone only": "Combination",
        "Red and shiny": "Sensitive",
        "Balanced": "Normal"
      }
    },

    {
      q: "Do you feel tightness during the day?",
      options: {
        "Yes": "Dry",
        "No": "Normal",
        "Sometimes": "Combination",
        "With irritation": "Sensitive",
        "With oiliness": "Oily"
      }
    },

    {
      q: "How visible are your pores?",
      options: {
        "Small": "Dry",
        "Large": "Oily",
        "Mixed": "Combination",
        "Inflamed": "Sensitive",
        "Balanced": "Normal"
      }
    },

    {
      q: "Does your skin react to weather changes?",
      options: {
        "Gets dry": "Dry",
        "Gets oily": "Oily",
        "Both": "Combination",
        "Red/irritated": "Sensitive",
        "No change": "Normal"
      }
    },

    {
      q: "How often do you need blotting papers?",
      options: {
        "Never": "Normal",
        "Daily": "Oily",
        "Sometimes": "Combination",
        "When irritated": "Sensitive",
        "When dry": "Dry"
      }
    },

    {
      q: "How does your skin look without products?",
      options: {
        "Dull": "Dry",
        "Shiny": "Oily",
        "Mixed": "Combination",
        "Red/Irritated": "Sensitive",
        "Balanced": "Normal"
      }
    }

  ];


  /* =========================================
     QUIZ VARIABLES
  ========================================= */

  let currentQuestion = 0;

  let answers = [];


  /* =========================================
     CURRENT FIREBASE USER
  ========================================= */

  let currentUser = null;


  onAuthStateChanged(auth, (user) => {

    if (user) {

      currentUser = user;

      console.log(
        "Quiz user:",
        currentUser.uid
      );

    } else {

      alert(
        "Please log in first."
      );

      window.location.href =
        "login.html";

    }

  });


  /* =========================================
     SHOW QUESTION
  ========================================= */

  function showQuestion(index) {

    const container =
      document.getElementById(
        "question-container"
      );

    const q =
      questions[index];


    container.innerHTML =
      `<h5>${index + 1}. ${q.q}</h5>`;


    Object.keys(q.options)
      .forEach((opt) => {

        container.innerHTML += `

          <div class="form-check">

            <input
              class="form-check-input"
              type="radio"
              name="q${index}"
              value="${q.options[opt]}"
            >

            <label class="form-check-label">
              ${opt}
            </label>

          </div>

        `;

      });


    /* Restore previous answer */

    if (answers[index]) {

      const previousAnswer =
        document.querySelector(
          `input[name="q${index}"][value="${answers[index]}"]`
        );

      if (previousAnswer) {

        previousAnswer.checked =
          true;

      }

    }


    updateProgress();

  }


  /* =========================================
     PROGRESS BAR
  ========================================= */

  function updateProgress() {

    const progress =
      ((currentQuestion) /
      questions.length) * 100;


    document.getElementById(
      "progressBar"
    ).style.width =
      progress + "%";


    document.getElementById(
      "progressText"
    ).textContent =
      `${Math.min(currentQuestion + 1, questions.length)} / ${questions.length}`;

  }


  /* =========================================
     NEXT BUTTON
  ========================================= */

  document
    .getElementById("nextBtn")
    .addEventListener(
      "click",
      () => {

        const selected =
          document.querySelector(
            `input[name="q${currentQuestion}"]:checked`
          );


        if (!selected) {

          alert(
            "Please select an answer!"
          );

          return;

        }


        answers[currentQuestion] =
          selected.value;


        currentQuestion++;


        if (
          currentQuestion <
          questions.length
        ) {

          showQuestion(
            currentQuestion
          );


          document.getElementById(
            "prevBtn"
          ).disabled = false;


          if (
            currentQuestion ===
            questions.length - 1
          ) {

            document.getElementById(
              "nextBtn"
            ).textContent =
              "Finish ✨";

          }

        } else {

          calculateResult();

        }

      }
    );


  /* =========================================
     PREVIOUS BUTTON
  ========================================= */

  document
    .getElementById("prevBtn")
    .addEventListener(
      "click",
      () => {

        if (currentQuestion > 0) {

          currentQuestion--;

          showQuestion(
            currentQuestion
          );


          if (
            currentQuestion === 0
          ) {

            document.getElementById(
              "prevBtn"
            ).disabled = true;

          }


          document.getElementById(
            "nextBtn"
          ).textContent =
            "Next →";

        }

      }
    );


  /* =========================================
     CALCULATE SKIN TYPE
  ========================================= */

  function calculateSkinType() {

    const counts = {

      Dry: 0,
      Oily: 0,
      Sensitive: 0,
      Combination: 0,
      Normal: 0

    };


    answers.forEach(
      (answer) => {

        if (
          counts[answer] !==
          undefined
        ) {

          counts[answer]++;

        }

      }
    );


    return Object.keys(
      counts
    ).reduce(
      (a, b) =>
        counts[a] >
        counts[b]
          ? a
          : b
    );

  }


  /* =========================================
     CALCULATE SKIN CONDITION
  ========================================= */

  function calculateSkinCondition() {

    let dryness = 0;

    let oiliness = 0;

    let irritation = 0;

    let breakouts = 0;


    answers.forEach(
      (answer, index) => {

        /* DRYNESS */

        if (
          index === 0 &&
          answer === "Dry"
        ) dryness++;


        if (
          index === 2 &&
          answer === "Dry"
        ) dryness++;


        if (
          index === 5 &&
          answer === "Dry"
        ) dryness++;


        if (
          index === 7 &&
          answer === "Dry"
        ) dryness++;


        if (
          index === 8 &&
          answer === "Dry"
        ) dryness++;


        if (
          index === 9 &&
          answer === "Dry"
        ) dryness++;


        /* OILINESS */

        if (
          index === 0 &&
          answer === "Oily"
        ) oiliness++;


        if (
          index === 1 &&
          answer === "Oily"
        ) {

          oiliness++;
          breakouts++;

        }


        if (
          index === 2 &&
          answer === "Oily"
        ) oiliness++;


        if (
          index === 4 &&
          answer === "Oily"
        ) oiliness++;


        if (
          index === 5 &&
          answer === "Oily"
        ) oiliness++;


        if (
          index === 6 &&
          answer === "Oily"
        ) oiliness++;


        if (
          index === 7 &&
          answer === "Oily"
        ) oiliness++;


        if (
          index === 8 &&
          answer === "Oily"
        ) oiliness++;


        if (
          index === 9 &&
          answer === "Oily"
        ) oiliness++;


        /* SENSITIVITY */

        if (
          answer === "Sensitive"
        ) {

          irritation++;

        }


        /* BREAKOUTS */

        if (
          index === 1 &&
          answer === "Combination"
        ) {

          breakouts++;

        }

      }
    );


    /* FINAL CONDITION */

    if (
      irritation >= 2
    ) {

      return "Redness / Irritation";

    }


    if (
      breakouts >= 1 &&
      oiliness >= 2
    ) {

      return "Acne-prone / Oily";

    }


    if (
      oiliness >= 3
    ) {

      return "Excess Oiliness";

    }


    if (
      dryness >= 3
    ) {

      return "Dryness";

    }


    if (
      breakouts >= 1
    ) {

      return "Occasional Breakouts";

    }


    return "Balanced / Healthy";

  }


  /* =========================================
     SAVE RESULT TO FIREBASE
  ========================================= */

  async function saveQuizResult(
    skinType,
    skinCondition
  ) {

    if (!currentUser) {

      alert(
        "You must be logged in to save your results."
      );

      window.location.href =
        "login.html";

      return false;

    }


    try {

      const userRef =
        ref(
          db,
          "users/" +
          currentUser.uid
        );


      await update(
        userRef,
        {

          skinType:
            skinType,

          skinCondition:
            skinCondition

        }
      );


      console.log(
        "Quiz results saved successfully:",
        {
          skinType,
          skinCondition
        }
      );


      return true;


    } catch (error) {

      console.error(
        "Error saving quiz result:",
        error
      );


      alert(
        "We couldn't save your quiz results. Please try again."
      );


      return false;

    }

  }


  /* =========================================
     FINAL RESULT
  ========================================= */

  async function calculateResult() {

    const skinType =
      calculateSkinType();


    const skinCondition =
      calculateSkinCondition();


    const saved =
      await saveQuizResult(
        skinType,
        skinCondition
      );


    if (!saved) {

      return;

    }


    /* SHOW RESULT */

    const result =
      document.getElementById(
        "result"
      );


    result.innerHTML = `

      ✨ <strong>Your Results</strong> ✨

      <br><br>

      <strong>Skin Type:</strong>
      ${skinType}

      <br>

      <strong>Skin Condition:</strong>
      ${skinCondition}

      <br><br>

      Your results have been saved
      to your account. 💗

    `;


    result.style.display =
      "block";


    /* LOCAL STORAGE */

    localStorage.setItem(
      "userSkinType",
      skinType
    );


    /* HIDE QUIZ */

    document.getElementById(
      "question-container"
    ).innerHTML = "";


    document.getElementById(
      "nextBtn"
    ).style.display =
      "none";


    document.getElementById(
      "prevBtn"
    ).style.display =
      "none";


    /* COMPLETE PROGRESS */

    document.getElementById(
      "progressBar"
    ).style.width =
      "100%";


    document.getElementById(
      "progressText"
    ).textContent =
      "Complete ✨";

  }


  /* =========================================
     START QUIZ
  ========================================= */

  showQuestion(
    currentQuestion
  );

</script>

</body>
</html>
