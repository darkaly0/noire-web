<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noiré Login/Sign Up</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    :root {
        --charcoal: #000000;
        --ivory: #F9F9F6;
        --champagne: #E6D9C9;
        --rose-gold: #B76E79;
        --sage: #A8B5A2;
        --blush: #F2D6D0;
    }
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
            135deg,
            var(--champagne),
            var(--ivory),
            var(--rose-gold)
        );
    
        font-family: 'Segoe UI', sans-serif;
        color: var(--charcoal);
    }
    .container {
        position: relative;
        width: 850px;
        height: 550px;
        background: #ffffff;
        border-radius: 30px;
        overflow: hidden;
        box-shadow:
            0 6px 20px rgba(0, 0, 0, 0.12);
    }
    .brand {
  position: absolute;
  top: 30px;               /* a bit lower for breathing space */
  left: 50%;               /* move to horizontal center */
  transform: translateX(-50%); /* shift back half its width */
  font-family: 'Playfair Display', serif;
  font-size: 48px;         /* bigger size */
  font-weight: 700;
  color: var(--rose-gold);
  z-index: 10;
  text-align: center;
}
    .form-box {
        position: absolute;
        top: 0;
        width: 50%;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 40px;
        background: #ffffff;
        transition:
            left 0.6s ease-in-out,
            right 0.6s ease-in-out,
            opacity 0.4s ease-in-out;
        z-index: 1;
    }
    .login {
        right: 0;
        opacity: 1;
        pointer-events: auto;
    }
    .register {
        left: -50%;
        opacity: 0;
        pointer-events: none;
    }
    .container.active .login {
        right: -50%;
        opacity: 0;
        pointer-events: none;
    }
    .container.active .register {
        left: 0;
        opacity: 1;
        pointer-events: auto;
    }
    .form-box h1 {
        margin-bottom: 20px;
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        color: var(--rose-gold);
    }
    .input-box {
        position: relative;
        width: 100%;
        margin: 25px 0;
    }
    .input-box input {
        width: 100%;
        padding: 13px 50px 13px 20px;
        background: var(--ivory);
        border: 1px solid #dddddd;
        border-radius: 8px;
        outline: none;
        font-family: 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 500;
        color: var(--charcoal);
        transition: 0.3s ease;
    }
    .input-box input:focus {
        border-color: var(--rose-gold);
        box-shadow:
            0 0 0 2px rgba(183, 110, 121, 0.12);
    }
    .input-box input::placeholder {
        color: #777777;
    }
    .input-box i {
        position: absolute;
        top: 50%;
        right: 20px;
        transform: translateY(-50%);
        font-size: 20px;
        color: var(--rose-gold);
        pointer-events: none;
    }
    .btn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 8px;
        background: var(--rose-gold);
        color: var(--ivory);
        font-family: 'Segoe UI', sans-serif;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
            background 0.3s ease,
            transform 0.2s ease;
    }
    .btn:hover {
        background: var(--sage);
        transform: translateY(-1px);
    }
    .btn:active {
        transform: translateY(0);
    }
    .google-btn {
        margin-top: 10px;
        background: #ffffff;
        color: var(--charcoal);
        border: 1px solid #cccccc;
    }
    .google-btn:hover {
        background: var(--ivory);
    
        color: var(--charcoal);
    }
    .google-btn i {
        margin-right: 8px;
        color: var(--rose-gold);
    }
    .toggle-box {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    }
    .toggle-box::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 50%;
        height: 100%;
        background: var(--champagne);
        border-radius: 0 150px 150px 0;
        z-index: 1;
        transition:
            left 0.8s ease-in-out,
            border-radius 0.8s ease-in-out;
    }
    .container.active .toggle-box::before {
        left: 50%;
        border-radius: 150px 0 0 150px;
    }
    .toggle-panel {
        position: absolute;
        top: 0;
        width: 50%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 30px;
        color: #ffffff;
        z-index: 2;
        transition:
            opacity 0.4s ease-in-out;
        pointer-events: auto;
    }
    .toggle-left {
        left: 0;
        opacity: 1;
    }
    .toggle-right {
        right: 0;
        opacity: 0;
        pointer-events: none;
    }
    .container.active .toggle-left {
        opacity: 0;
        pointer-events: none;
    }
    .container.active .toggle-right {
        opacity: 1;
        pointer-events: auto;
    }
    .toggle-panel h1 {
        margin-bottom: 8px;
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        color: var(--ivory);
    }
    .toggle-panel p {
        margin-bottom: 20px;
        font-size: 15px;
        color: #ffffff;
    }
    .toggle-panel .btn {
        width: 160px;
        height: 46px;
        background: transparent;
        border: 2px solid #ffffff;
        border-radius: 8px;
        color: #ffffff;
    }
    .toggle-panel .btn:hover {
        background: #ffffff;
    
        color: var(--rose-gold);
    }
    @media (max-width: 900px) {
        .container {
            width: 90%;
            height: 550px;
        }
        .form-box {
            padding: 30px;
        }
        .toggle-panel {
            padding: 20px;
        }
        .brand {
            left: 25px;
            top: 15px;
            font-size: 26px;
        }
    }
    @media (max-width: 600px) {
        .container {
            width: 95%;
            height: 650px;
            border-radius: 20px;
        }
        .form-box {
            width: 100%;
            padding: 30px;
            justify-content: center;
        }
        .login,
        .register {
            width: 100%;
        }
        .container.active .login {
            right: -100%;
        }
        .container.active .register {
            left: 0;
        }
        .toggle-box {
            display: none;
        }
        .brand {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
        }
    }
    </style>
</head>
<body>

<div class="brand">Noiré Skin</div>
<div class="container">
  <!-- Login Form -->
  <div class="form-box login">
    <form>
      <h1>Login</h1>
      <div class="input-box">
        <input type="text" placeholder="Email" required>
        <i class="fa-regular fa-user"></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password" required>
        <i class="fa-solid fa-lock"></i>
      </div>
      <button type="button" class="btn">Login</button>
      <p style="text-align:center;margin-top:10px;">Or</p>
      <button type="button" class="btn google-btn">
        <i class="fa-brands fa-google"></i> Sign in with Google
      </button>
    </form>
  </div>

  <!-- Register Form -->
  <div class="form-box register">
    <form>
      <h1>Registration</h1>
      <div class="input-box">
        <input type="text" placeholder="Username" required>
        <i class="fa-regular fa-user"></i>
      </div>
      <div class="input-box">
        <input type="email" placeholder="Email" required>
        <i class="fa-solid fa-envelope"></i>
      </div>
      <div class="input-box">
        <input type="password" placeholder="Password" required>
        <i class="fa-solid fa-lock"></i>
      </div>
      <button type="button" class="btn">Register</button>
      <button type="button" class="btn google-btn">
        <i class="fa-brands fa-google"></i> Sign up with Google
      </button>
    </form>
  </div>

  <!-- Toggle Panels -->
  <div class="toggle-box">
    <div class="toggle-panel toggle-left">
      <h1>Welcome Back!</h1>
      <p>Don't have an account yet?</p>
      <button class="btn register-btn">Register</button>
    </div>
    <div class="toggle-panel toggle-right">
      <h1>Hello, Welcome!</h1>
      <p>Already have an Account?</p>
      <button class="btn login-btn">Login</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getDatabase,
  ref,
  push,
  set,
  get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAxcZCFA9IPIfv-slryJXdPQJ_lfttKMC8",
  authDomain: "noire-17ed6.firebaseapp.com",
  databaseURL: "https://noire-17ed6-default-rtdb.firebaseio.com",
  projectId: "noire-17ed6",
  storageBucket: "noire-17ed6.appspot.com",
  messagingSenderId: "559789891078",
  appId: "1:559789891078:web:7bf4c52bce62c3b8b9ad87"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

async function logCustomerAudit(action, area, details, entityId = "") {
  try {
    const user = auth.currentUser;
    if (!user) return;
    const auditRef = push(ref(db, "auditTrail"));
    await set(auditRef, {
      actorType: "customer",
      action: String(action || "Activity"),
      area: String(area || "System"),
      details: String(details || ""),
      entityId: String(entityId || ""),
      customerId: user.uid,
      customerName: user.displayName || user.email || "Customer",
      customerEmail: user.email || "",
      timestamp: Date.now()
    });
  } catch (error) {
    console.error("CUSTOMER AUDIT LOG ERROR:", error);
  }
}

/*
  IMPORTANT:
  Keep the Noiré customer logged in when moving between pages.
*/
await setPersistence(auth, browserLocalPersistence);

/* ---------------------------------------------------------
   FORM TOGGLE
--------------------------------------------------------- */
const container = document.querySelector(".container");
const registerBtn = document.querySelector(".register-btn");
const loginBtn = document.querySelector(".login-btn");

registerBtn?.addEventListener("click", () => {
  container.classList.add("active");
});

loginBtn?.addEventListener("click", () => {
  container.classList.remove("active");
});

/* ---------------------------------------------------------
   HELPERS
--------------------------------------------------------- */
function getLoginEmail() {
  return document.querySelector(".login input[type=email]")?.value.trim()
    || document.querySelector(".login input[type=text]")?.value.trim()
    || "";
}

function getRegisterEmail() {
  return document.querySelector(".register input[type=email]")?.value.trim() || "";
}

function setButtonLoading(button, loading, text) {
  if (!button) return;
  button.disabled = loading;
  button.textContent = loading ? text : button.dataset.originalText;
}

function redirectToAccount() {
  window.location.replace("account.html");
}

/* ---------------------------------------------------------
   RESTORE EXISTING CUSTOMER SESSION
--------------------------------------------------------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) return;

  console.log("Noiré customer session restored:", user.uid);

  /*
    If the user is already authenticated and opens the login
    page again, send them back to their account instead of
    making them log in again.
  */
  try {
    await auth.authStateReady();
  } catch (error) {
    console.warn("Auth state ready warning:", error);
  }
});

/* ---------------------------------------------------------
   REGISTER
--------------------------------------------------------- */
const registerButton = document.querySelector(".register .btn");

if (registerButton) {
  registerButton.dataset.originalText = "Register";

  registerButton.addEventListener("click", async (event) => {
    event.preventDefault();

    const username =
      document.querySelector(".register input[type=text]")?.value.trim() || "";
    const email = getRegisterEmail();
    const password =
      document.querySelector(".register input[type=password]")?.value || "";

    if (!username || !email || !password) {
      alert("Please complete all registration fields.");
      return;
    }

    setButtonLoading(registerButton, true, "Creating Account...");

    try {
      const userCredential =
        await createUserWithEmailAndPassword(auth, email, password);

      const user = userCredential.user;

      await set(ref(db, "users/" + user.uid), {
        username,
        email,
        createdAt: Date.now()
      });

      await logCustomerAudit(
        "Created Account",
        "Account",
        `Created customer account "${username}"`,
        user.uid
      );

      alert("Registration successful! Welcome to Noiré. ✨");
      redirectToAccount();

    } catch (error) {
      console.error("REGISTRATION ERROR:", error);
      alert(error.message || "Unable to create your account.");
      setButtonLoading(registerButton, false);
    }
  });
}

/* ---------------------------------------------------------
   LOGIN
--------------------------------------------------------- */
const loginButton = document.querySelector(".login .btn");

if (loginButton) {
  loginButton.dataset.originalText = "Login";

  loginButton.addEventListener("click", async (event) => {
    event.preventDefault();

    const email = getLoginEmail();
    const password =
      document.querySelector(".login input[type=password]")?.value || "";

    if (!email || !password) {
      alert("Please enter your email and password.");
      return;
    }

    setButtonLoading(loginButton, true, "Signing In...");

    try {
      /*
        This is the actual Firebase Authentication login.
      */
      const userCredential =
        await signInWithEmailAndPassword(auth, email, password);

      const user = userCredential.user;

      /*
        Confirm Firebase has finished restoring/setting the
        authenticated state before leaving this page.
      */
      await auth.authStateReady();

      /*
        Check that the customer's profile exists in RTDB.
        This does NOT sign the user out if the profile is missing.
      */
      const snapshot = await get(ref(db, "users/" + user.uid));

      if (!snapshot.exists()) {
        /*
          Older accounts may exist in Firebase Auth but not
          have a users/{uid} record. Create the missing profile
          instead of treating the customer as logged out.
        */
        await set(ref(db, "users/" + user.uid), {
          username: user.displayName || email.split("@")[0],
          email: user.email || email,
          createdAt: Date.now()
        });
      }

      const userData = snapshot.exists() ? snapshot.val() : null;
      const displayName =
        userData?.username ||
        user.displayName ||
        email.split("@")[0];

      await logCustomerAudit(
        "Logged In",
        "Account",
        "Signed in to the Noiré customer account"
      );

      alert("Welcome back, " + displayName + "! ✨");

      /*
        THIS WAS MISSING BEFORE:
        actually navigate to the account page after login.
      */
      redirectToAccount();

    } catch (error) {
      console.error("LOGIN ERROR:", error);

      let message = error.message || "Unable to sign in.";

      if (error.code === "auth/invalid-credential") {
        message = "Incorrect email or password.";
      } else if (error.code === "auth/invalid-email") {
        message = "Please enter a valid email address.";
      } else if (error.code === "auth/user-not-found") {
        message = "No Noiré account was found with that email.";
      } else if (error.code === "auth/wrong-password") {
        message = "Incorrect email or password.";
      }

      alert(message);
      setButtonLoading(loginButton, false);
    }
  });
}

/* ---------------------------------------------------------
   GOOGLE LOGIN
--------------------------------------------------------- */
const googleButtons = document.querySelectorAll(".google-btn");

googleButtons.forEach((button) => {
  button.addEventListener("click", async (event) => {
    event.preventDefault();

    try {
      const provider = new GoogleAuthProvider();

      const result = await signInWithPopup(auth, provider);
      const user = result.user;

      await auth.authStateReady();

      const userRef = ref(db, "users/" + user.uid);
      const snapshot = await get(userRef);

      if (!snapshot.exists()) {
        await set(userRef, {
          username:
            user.displayName ||
            user.email?.split("@")[0] ||
            "Noiré Customer",
          email: user.email || "",
          createdAt: Date.now()
        });
      }

      await logCustomerAudit(
        "Logged In with Google",
        "Account",
        "Signed in with Google"
      );

      alert("Welcome to Noiré, " + (user.displayName || "beautiful") + "! ✨");
      redirectToAccount();

    } catch (error) {
      console.error("GOOGLE LOGIN ERROR:", error);

      if (error.code !== "auth/popup-closed-by-user") {
        alert(error.message || "Unable to sign in with Google.");
      }
    }
  });
});
</script> 
</body>
</html>
