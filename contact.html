<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Noiré</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --charcoal: #000000;
      --ivory: #F9F9F6;
      --champagne: #F7E7CE;
      --rose-gold: #B76E79;
      --sage: #A8B5A2;
    }

    body {
      background: var(--ivory);
      color: var(--charcoal);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    header {
      background: var(--champagne);
      padding: 2rem;
      text-align: center;
      border-bottom: 2px solid var(--rose-gold);
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 700;
      color: var(--rose-gold);
      margin: 0;
    }

    nav {
      text-align: center;
      background: #fff;
      padding: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      font-weight: 600;
      color: var(--charcoal);
      transition: color 0.3s ease;
    }
    nav a:hover {
      color: var(--rose-gold);
    }

    .hero {
      background: linear-gradient(135deg, var(--champagne), var(--ivory), var(--rose-gold));
      padding: 3rem;
      border-radius: 20px;
      margin: 2rem auto;
      max-width: 700px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      text-align: center;
    }
    .hero h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      color: var(--rose-gold);
      margin-bottom: 1.5rem;
    }

    .btn-rose {
      background: var(--rose-gold);
      color: var(--ivory);
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-rose:hover {
      background: var(--sage);
      transform: translateY(-2px);
    }

    footer {
      width: 100%;              /* span full width */
      background: var(--champagne); /* or any brand color */
      text-align: center;
      padding: 1rem;
      font-family: 'Playfair Display', serif;
      color: var(--rose-gold);
      border-top: 2px solid var(--rose-gold);
      position: relative;       /* keeps it in flow */
    }

  </style>
</head>
<body>
<header><h1>Contact Us</h1></header>
<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="shop.html">Shop</a>
  <a href="routine.html">Routine Builder</a>
  <a href="blog.html">Blog</a>
  <a href="contact.html">Contact</a>
  <a href="account.html">Account</a>
  <a href="cart.html">Cart</a>
</nav>

<section class="hero">
  <h2>We’d Love to Hear From You</h2>
  <form class="text-start">
    <div class="mb-3">
      <label class="form-label">Name:</label>
      <input type="text" class="form-control" placeholder="Enter your name">
    </div>
    <div class="mb-3">
      <label class="form-label">Email:</label>
      <input type="email" class="form-control" placeholder="Enter your email">
    </div>
    <div class="mb-3">
      <label class="form-label">Message:</label>
      <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
    </div>
    <button type="submit" class="btn btn-rose">Send</button>
  </form>
</section>

<footer>
  <p>&copy; 2026 Noiré Skincare. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
